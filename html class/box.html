<!DOCTYPE html>
<html>
    <head>
        <style>
            .block{
                display: block;
                width: 200px;
                background-color: lightblue;
                margin: 5px;
            }

            .inline{
                display: inline;
                background-color: lightgreen;
            }

            .inline-block{
                display: inline-block;
                width: 150px;
                height: 50px;
                background-color: lightyellow;
                margin: 5px;
            }
        </style>
    </head>

    <body>
        <h2>1. Block</h2>

        <div class="block">Box 1</div>
        <div class="block">Box 2</div>
        <div class="block">Box 3</div>
        
    </body>
</html>
